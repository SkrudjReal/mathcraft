[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathcraft1"
version = "0.2.1"
description = "Math helpers and an experimental Windows terminal with SSH autostart, input hooks and cursor overlays"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
keywords = ["math", "mathematics", "vectors", "numerical-methods", "powershell"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools]
packages = ["mathcraft"]
